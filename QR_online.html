<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04080F">
<title>Ferry Viteoca — Validador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ── RESET & ROOT ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:        #04080F;
  --bg2:       #080E1A;
  --surface:   #0C1524;
  --surface2:  #111D30;
  --surface3:  #162238;
  --border:    #FFFFFF0D;
  --border2:   #FFFFFF18;
  --border3:   #FFFFFF2A;

  --blue:      #1D4ED8;
  --blue2:     #2563EB;
  --blue3:     #3B82F6;
  --cyan:      #06B6D4;
  --cyan2:     #22D3EE;

  --green:     #15803D;
  --green2:    #16A34A;
  --green3:    #22C55E;
  --green4:    #4ADE80;

  --amber:     #D97706;
  --amber2:    #F59E0B;
  --amber3:    #FCD34D;

  --red:       #B91C1C;
  --red2:      #DC2626;
  --red3:      #EF4444;
  --red4:      #FCA5A5;

  --text:      #E2EAF8;
  --text2:     #94A3B8;
  --text3:     #4B5A6E;

  --nav-h:     60px;
  --tab-h:     52px;
  --r:         14px;
  --r-sm:      8px;
}

html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  -webkit-font-smoothing:antialiased;
}

/* ════════════════════════════════════
   LOGIN SCREEN
════════════════════════════════════ */
#login-screen{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  gap:0;
}
#login-screen.hidden{
  pointer-events:none;
  animation:fadeOut 0.4s ease forwards;
}
@keyframes fadeOut{to{opacity:0;transform:scale(0.97)}}

/* Background mesh */
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(37,99,235,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 80% 90%, rgba(6,182,212,0.08) 0%, transparent 70%);
  pointer-events:none;
}

.login-logo{
  width:72px;height:72px;
  background:linear-gradient(145deg,#0F2244,#0C1A36);
  border:1px solid var(--border3);
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04);
  margin-bottom:20px;
  animation:logoIn 0.6s cubic-bezier(0.34,1.3,0.64,1) both;
}
@keyframes logoIn{from{opacity:0;transform:translateY(-20px) scale(0.8)}to{opacity:1;transform:none}}

.login-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:38px;letter-spacing:4px;
  color:#fff;
  text-shadow:0 0 40px rgba(59,130,246,0.4);
  line-height:1;margin-bottom:4px;
  animation:fadeUp 0.5s 0.1s ease both;
}
.login-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;letter-spacing:3px;
  color:var(--text3);text-transform:uppercase;
  margin-bottom:36px;
  animation:fadeUp 0.5s 0.15s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.login-form{
  width:100%;max-width:360px;
  display:flex;flex-direction:column;gap:12px;
  animation:fadeUp 0.5s 0.2s ease both;
}
.input-group{position:relative}
.input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none;color:var(--text3);
}
.login-input{
  width:100%;padding:14px 14px 14px 44px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
  -webkit-appearance:none;
}
.login-input::placeholder{color:var(--text3)}
.login-input:focus{
  border-color:var(--blue3);
  box-shadow:0 0 0 3px rgba(59,130,246,0.12);
}
.login-input.error{border-color:var(--red2)}

.login-btn{
  padding:15px;border:none;border-radius:var(--r);
  background:linear-gradient(135deg,var(--blue2),var(--blue3));
  color:#fff;font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  box-shadow:0 4px 20px rgba(37,99,235,0.35);
  transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.login-btn:active{transform:scale(0.98)}
.login-btn:disabled{opacity:0.6;cursor:default}
.login-btn.loading::after{
  content:'';width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;
  border-radius:50%;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.login-error{
  background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.25);
  color:var(--red4);font-size:13px;border-radius:var(--r-sm);
  padding:10px 14px;text-align:center;display:none;
}
.login-error.show{display:block}

/* ════════════════════════════════════
   MAIN APP
════════════════════════════════════ */
#app{
  height:100dvh;
  display:grid;
  grid-template-rows:var(--nav-h) 1fr var(--tab-h);
  overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity 0.3s 0.2s;
}
#app.visible{opacity:1;pointer-events:auto}

/* NAV */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,rgba(8,14,26,0.98) 0%,rgba(4,8,15,0.95) 100%);
  border-bottom:1px solid var(--border2);
  position:relative;z-index:10;
  backdrop-filter:blur(10px);
}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-icon{
  width:36px;height:36px;
  background:linear-gradient(145deg,#0F2244,#0C1A36);
  border:1px solid var(--border3);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.nav-name{
  font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;
  color:#EF4444;text-shadow:0 0 20px rgba(239,68,68,0.35);line-height:1;
}
.nav-sub{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;margin-top:1px;
}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-user{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px 5px 6px;
  cursor:pointer;transition:border-color 0.2s;
}
.nav-user:active{border-color:var(--border3)}
.nav-user-avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue2),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}
.nav-user-name{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:0.5px;color:var(--text);max-width:80px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px;
}
.nav-dot-live{
  width:6px;height:6px;border-radius:50%;
  background:var(--green3);box-shadow:0 0 6px var(--green3);
  animation:breathe 2s ease-in-out infinite;
}
.nav-dot-live.offline{background:var(--red3);box-shadow:0 0 6px var(--red3);animation:none}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.3}}
.nav-count{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--cyan2);
}

/* TABS */
.tabs{
  display:flex;
  background:linear-gradient(0deg,rgba(8,14,26,0.98),var(--bg2));
  border-top:1px solid var(--border2);
}
.tab{
  flex:1;border:none;background:none;color:var(--text3);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 4px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color 0.2s;position:relative;
}
.tab-icon{font-size:19px;line-height:1}
.tab::after{
  content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:var(--cyan2);border-radius:0 0 3px 3px;
  transform:scaleX(0);transition:transform 0.25s cubic-bezier(0.34,1.5,0.64,1);
}
.tab.active{color:var(--cyan2)}
.tab.active::after{transform:scaleX(1)}

/* PAGES */
.page{overflow:hidden;display:none;flex-direction:column}
.page.active{display:flex}

/* ════════════════════════════════════
   SCANNER PAGE
════════════════════════════════════ */
#page-scanner{
  padding:12px 12px 0;gap:10px;
  background:var(--bg);
}

.cam-wrapper{
  flex:1;min-height:0;position:relative;
  border-radius:18px;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border2);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);
}
#reader{width:100%;height:100%;border:none !important;background:transparent}
#reader video{width:100% !important;height:100% !important;object-fit:cover}
#reader > div:first-child{padding:0 !important;border:none !important}
#reader img,#reader select,#reader button{display:none !important}
#reader div[style*="text-align"]{display:none !important}

.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

/* Marco QR */
.qr-frame{width:200px;height:200px;position:relative}
.qr-corner{position:absolute;width:32px;height:32px}
.qr-corner::before,.qr-corner::after{content:'';position:absolute;background:var(--cyan2)}
.qr-corner.tl{top:0;left:0}
.qr-corner.tl::before{top:0;left:0;width:32px;height:3px;border-radius:3px 3px 0 0}
.qr-corner.tl::after{top:0;left:0;width:3px;height:32px;border-radius:3px 0 0 3px}
.qr-corner.tr{top:0;right:0}
.qr-corner.tr::before{top:0;right:0;width:32px;height:3px;border-radius:3px 3px 0 0}
.qr-corner.tr::after{top:0;right:0;width:3px;height:32px;border-radius:0 3px 3px 0}
.qr-corner.bl{bottom:0;left:0}
.qr-corner.bl::before{bottom:0;left:0;width:32px;height:3px;border-radius:0 0 3px 3px}
.qr-corner.bl::after{bottom:0;left:0;width:3px;height:32px;border-radius:3px 0 0 3px}
.qr-corner.br{bottom:0;right:0}
.qr-corner.br::before{bottom:0;right:0;width:32px;height:3px;border-radius:0 0 3px 3px}
.qr-corner.br::after{bottom:0;right:0;width:3px;height:32px;border-radius:0 3px 3px 0}

.scan-line{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--cyan2) 40%,var(--cyan2) 60%,transparent 100%);
  box-shadow:0 0 10px var(--cyan2),0 0 20px rgba(34,211,238,0.4);
  animation:scanline 2.4s ease-in-out infinite;
}
@keyframes scanline{0%,100%{top:0;opacity:1}50%{top:100%;opacity:0.7}}

.cam-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 90% at center, transparent 45%, rgba(4,8,15,0.7) 100%);
  pointer-events:none;
}

.scan-status-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:12px;padding:11px 16px;margin:0 0 12px;
}
.scan-status-left{display:flex;align-items:center;gap:10px}
.scan-pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--green3);box-shadow:0 0 8px var(--green3);
  animation:breathe 1.5s ease-in-out infinite;flex-shrink:0;
}
.scan-pulse.idle{background:var(--text3);box-shadow:none;animation:none}
.scan-pulse.error{background:var(--red3);box-shadow:0 0 8px var(--red3);animation:none}
.scan-label{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:var(--text);
}
.scan-num{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--cyan2)}

/* ════════════════════════════════════
   DATA PAGE
════════════════════════════════════ */
#page-data{background:var(--bg);overflow-y:auto;gap:0}

.data-inner{display:flex;flex-direction:column;gap:10px;padding:12px}

.conn-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.conn-left{display:flex;align-items:center;gap:10px}
.conn-indicator{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  background:var(--green3);box-shadow:0 0 10px var(--green3);
  animation:breathe 2s ease-in-out infinite;
}
.conn-indicator.offline{background:var(--red3);box-shadow:0 0 8px var(--red3);animation:none}
.conn-indicator.busy{background:var(--amber2);box-shadow:0 0 8px var(--amber2);animation:breathe 0.6s ease-in-out infinite}
.conn-text{}
.conn-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2)}
.conn-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--cyan2);margin-top:2px}

.btn-sm{
  border:none;border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;
  background:var(--surface2);border:1px solid var(--border3);color:var(--text2);
}
.btn-sm:active{transform:scale(0.95)}
.btn-sm.spinning .btn-spin{animation:spin 0.7s linear infinite}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);padding:16px 10px 14px;text-align:center;
  position:relative;overflow:hidden;
}
.stat-box::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.02) 0%,transparent 60%);
}
.stat-box-line{
  position:absolute;bottom:0;left:0;right:0;height:2px;
}
.stat-box.s-total .stat-box-line{background:linear-gradient(90deg,transparent,var(--cyan2),transparent)}
.stat-box.s-pend  .stat-box-line{background:linear-gradient(90deg,transparent,var(--green3),transparent)}
.stat-box.s-used  .stat-box-line{background:linear-gradient(90deg,transparent,var(--amber2),transparent)}
.stat-n{
  font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;line-height:1;
  margin-bottom:4px;
}
.stat-box.s-total .stat-n{color:var(--cyan2)}
.stat-box.s-pend  .stat-n{color:var(--green3)}
.stat-box.s-used  .stat-n{color:var(--amber2)}
.stat-l{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:2px;color:var(--text3);text-transform:uppercase;
}

.section-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);overflow:hidden;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border);
}
.section-title{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;color:var(--text3);text-transform:uppercase;
}
.section-badge{
  font-family:'DM Mono',monospace;font-size:11px;color:var(--cyan2);
  background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.15);
  padding:2px 8px;border-radius:20px;
}

.recent-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--border);
  transition:background 0.15s;
}
.recent-row:last-child{border-bottom:none}
.recent-row:active{background:var(--surface2)}
.rr-name{font-size:14px;font-weight:600;color:var(--text)}
.rr-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text3);letter-spacing:0.5px;margin-top:2px}
.badge-ok{
  background:rgba(34,197,94,0.12);color:var(--green4);
  border:1px solid rgba(34,197,94,0.2);
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1.5px;padding:3px 8px;border-radius:4px;text-transform:uppercase;
  white-space:nowrap;
}
.empty-msg{
  padding:32px 16px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;
  letter-spacing:1px;color:var(--text3);
}
.empty-msg-icon{display:block;font-size:28px;margin-bottom:8px;opacity:0.4}

/* ════════════════════════════════════
   HISTORY PAGE
════════════════════════════════════ */
#page-history{background:var(--bg)}

.hist-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
}
.hist-title{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;color:var(--text3);text-transform:uppercase;
}
.hist-count{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--cyan2)}

#history-list{
  flex:1;overflow-y:auto;padding:0 12px 12px;
  display:flex;flex-direction:column;gap:6px;
}
.hist-item{
  background:var(--surface);
  border:1px solid var(--border2);
  border-left:3px solid var(--green3);
  border-radius:10px;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;
  animation:fadeUp 0.3s ease both;
}
.hist-name{font-weight:600;font-size:14px}
.hist-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text3);letter-spacing:0.5px;margin-top:2px}
.hist-badge{
  background:rgba(34,197,94,0.1);color:var(--green4);
  border:1px solid rgba(34,197,94,0.18);
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1.5px;padding:3px 8px;border-radius:4px;text-transform:uppercase;
}

/* ════════════════════════════════════
   MODAL (bottom sheet)
════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex}

.modal-sheet{
  width:100%;max-width:480px;
  border-radius:22px 22px 0 0;
  padding:24px 22px 32px;text-align:center;
  animation:sheetUp 0.35s cubic-bezier(0.34,1.2,0.64,1);
  position:relative;overflow:hidden;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.modal-sheet::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.04) 0%,transparent 40%);pointer-events:none}

.modal-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.15);margin:0 auto 20px}

.modal-icon-ring{
  width:76px;height:76px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;font-size:32px;
}
.modal-heading{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:4px;margin-bottom:16px}

.modal-details{
  text-align:left;
  background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:4px 0;margin-bottom:20px;
}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 16px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;
}
.detail-row:last-child{border-bottom:none}
.detail-key{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;color:rgba(255,255,255,0.35);text-transform:uppercase;
}
.detail-val{font-weight:600;max-width:58%;text-align:right;word-break:break-all;font-size:13px}

.btn-continue{
  width:100%;padding:14px;border:none;border-radius:12px;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:all 0.2s;
}
.btn-continue:active{transform:scale(0.98)}

/* TOAST */
.toast{
  position:fixed;bottom:72px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--surface2);border:1px solid var(--border3);
  color:var(--text);padding:10px 20px;border-radius:40px;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:1px;z-index:400;opacity:0;pointer-events:none;

  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>

<!-- ══════════════════════════════════════
     LOGIN SCREEN

<!-- ══════════════════════════════════════
     MAIN APP
═══════════════════════════════════════ -->
<div id="app">

  <nav class="nav">

  <!-- SCANNER -->

    <div class="scan-status-bar" style="margin:10px 12px 12px;">

  <!-- DATA -->

        <button class="btn-sm" id="btn-refresh" onclick="refreshStats()">
          <span class="btn-spin">↻</span> Actualizar

      <div class="stats-row">

          <div class="stat-n" id="s-total">—</div>

          <div class="stat-l">Pendientes</div>
          <div class="stat-box-line"></div>
        </div>
        <div class="stat-box s-used">
          <div class="stat-n" id="s-used">—</div>
          <div class="stat-l">Escaneados</div>
          <div class="stat-box-line"></div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <span class="section-title">🕐 Últimas validaciones</span>

        </div>

  <!-- HISTORY -->

        Sin registros aún

  <div class="tabs">
    <button class="tab active" data-page="scanner">
      <span class="tab-icon">📷</span>Escáner

      <span class="tab-icon">📊</span>Datos
    </button>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="handleModalBg(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-icon-ring" id="modal-icon-ring"><span id="modal-icon">✓</span></div>
    <div class="modal-heading" id="modal-heading">VÁLIDO</div>
    <div class="modal-details" id="modal-details"></div>
    <button class="btn-continue" id="modal-btn" onclick="closeModal()">Continuar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
// ══════════════════════════════════════════════
//  CONFIG — solo el origen del servidor proxy
//  ¡Ninguna clave Supabase aquí!
// ══════════════════════════════════════════════

// Si el HTML está servido por el mismo server.js, usa ruta relativa.
// Si tienes otro dominio, pon la URL completa: 'https://tuservidor.com'
const API = '';   // '' = mismo origen (recomendado)

// ══════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════
const S = {
  token:         null,
  userName:      '',
  scanner:       null,
  scannerActive: false,
  isProcessing:  false,
  lastCode:      null,
  count:         0,
  online:        false,
};

const $ = id => document.getElementById(id);

// ══════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════
async function doLogin() {
  const user = $('inp-user').value.trim();
  const pass = $('inp-pass').value;
  if (!user || !pass) return showLoginError('Rellena usuario y contraseña');

  const btn = $('login-btn');
  btn.disabled = true;
  btn.classList.add('loading');
  $('login-btn-text').textContent = '';
  hideLoginError();

  try {
    const r = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al iniciar sesión');

    S.token    = data.token;
    S.userName = data.name;
    sessionStorage.setItem('fv_token', data.token);
    sessionStorage.setItem('fv_name', data.name);
    enterApp();
  } catch(e) {
    showLoginError(e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    $('login-btn-text').textContent = 'Entrar';
  }
}

function showLoginError(msg) {
  const el = $('login-error');
  el.textContent = msg;
  el.classList.add('show');
  $('inp-user').classList.add('error');
  $('inp-pass').classList.add('error');
}
function hideLoginError() {
  $('login-error').classList.remove('show');
  $('inp-user').classList.remove('error');
  $('inp-pass').classList.remove('error');
}

function enterApp() {
  // Actualizar nombre en navbar
  const initials = S.userName.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
  $('nav-avatar').textContent = initials;
  $('nav-username').textContent = S.userName.split(' ')[0];

  $('login-screen').classList.add('hidden');
  $('app').classList.add('visible');

  refreshStats();
  startScanner();
}

function confirmLogout() {
  if (confirm(`¿Cerrar sesión de ${S.userName}?`)) logout();
}
function logout() {
  stopScanner();
  S.token = null;
  sessionStorage.removeItem('fv_token');
  sessionStorage.removeItem('fv_name');
  $('app').classList.remove('visible');
  $('login-screen').classList.remove('hidden');
  $('inp-pass').value = '';
}

// ══════════════════════════════════════════════
//  API HELPERS
// ══════════════════════════════════════════════
function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${S.token}` };
}

async function apiFetch(path, opts = {}) {
  const r = await fetch(`${API}${path}`, {
    ...opts,
    headers: { ...authHeaders(), ...(opts.headers || {}) }
  });
  if (r.status === 401) { logout(); throw new Error('Sesión expirada'); }
  return r;
}

// ══════════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════════
async function refreshStats() {
  $('conn-dot').className = 'conn-indicator busy';
  $('conn-title').textContent = 'Actualizando…';
  const btn = $('btn-refresh');
  btn.classList.add('spinning');

  try {
    const r = await apiFetch('/api/stats');
    const d = await r.json();
    $('s-total').textContent = d.total;
    $('s-pend').textContent  = d.pending;
    $('s-used').textContent  = d.escaneados;
    $('conn-dot').className = 'conn-indicator';
    $('conn-title').textContent = 'Conectado';
    S.online = true;
    $('nav-live-dot').className = 'nav-dot-live';
  } catch(e) {
    $('conn-dot').className = 'conn-indicator offline';
    $('conn-title').textContent = 'Sin conexión';
    S.online = false;
    $('nav-live-dot').className = 'nav-dot-live offline';
    if (e.message !== 'Sesión expirada') showToast('⚠ Sin conexión');
  } finally {
    btn.classList.remove('spinning');
  }
}

// ══════════════════════════════════════════════
//  QR PARSER
// ══════════════════════════════════════════════
function parseQR(raw) {
  if (!raw) return null;
  raw = raw.trim();
  let text = raw;
  if (raw.startsWith('http')) {
    try {
      const url = new URL(raw);
      const d = url.searchParams.get('data');
      if (d) text = decodeURIComponent(d).trim();
    } catch { }
  }
  return {
    raw:        text,
    compra_id:  (text.match(/Compra:\s*([0-9a-f\-]{36})/i) || [])[1]?.trim() || null,
    viaje_id:   (text.match(/Viaje:\s*([0-9a-f\-]{36})/i)  || [])[1]?.trim() || null,
    pasajero:   (text.match(/Pasajero:\s*([^,]+)/i)         || [])[1]?.trim() || '—',
  };
}

// ══════════════════════════════════════════════
//  SCANNER
// ══════════════════════════════════════════════
function resetReader() { $('reader').innerHTML = '' }

async function startScanner() {
  if (S.scannerActive) return;
  resetReader();
  S.scanner = new Html5Qrcode('reader');
  try {
    await S.scanner.start(
      { facingMode: 'environment' },
      { fps: 15, qrbox: { width: 200, height: 200 } },
      onScan
    );
    S.scannerActive = true;
    setScanStatus('active', 'Escáner activo');
  } catch {
    setScanStatus('error', 'Sin acceso a cámara');
  }
}

async function stopScanner() {
  if (!S.scannerActive || !S.scanner) return;
  try { await S.scanner.stop() } catch {}
  try { await S.scanner.clear() } catch {}
  S.scanner = null;
  S.scannerActive = false;
}

function setScanStatus(state, label) {
  const dot = $('scan-pulse');
  $('scan-label').textContent = label;
  dot.className = 'scan-pulse' + (state === 'idle' ? ' idle' : state === 'error' ? ' error' : '');
}

// ══════════════════════════════════════════════
//  SCAN HANDLER
// ══════════════════════════════════════════════
async function onScan(raw) {
  if (S.isProcessing) return;
  ensureAudio();

  const parsed   = parseQR(raw);
  const cacheKey = parsed?.compra_id || raw;
  if (cacheKey === S.lastCode) return;

  S.isProcessing = true;
  S.lastCode     = cacheKey;
  setScanStatus('active', 'Consultando…');

  try {
    const r = await apiFetch('/api/scan', {
      method : 'POST',
      body   : JSON.stringify({ compra_id: parsed?.compra_id, raw_qr: raw })
    });
    const data = await r.json();

    S.count++;
    $('scan-num').textContent   = S.count;
    $('nav-count').textContent  = S.count;

    if (data.status === 'valid') {
      playBeep('valid');
      navigator.vibrate?.([80, 40, 80]);
      showModal('valid', parsed, data.record);
      addToHistory(parsed, data.record);
      refreshStats();
    } else if (data.status === 'used') {
      playBeep('used');
      navigator.vibrate?.(200);
      showModal('used', parsed, data.record);
    } else {
      playBeep('invalid');
      navigator.vibrate?.(500);
      showModal('notfound', parsed, null);
    }
  } catch(e) {
    playBeep('invalid');
    if (e.message !== 'Sesión expirada') showToast('⚠ Error de conexión');
  }

  setScanStatus('active', 'Escáner activo');
  setTimeout(() => { S.isProcessing = false; S.lastCode = null }, 3000);
}

// ══════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════
let _ctx = null;
function ensureAudio() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
}
function playBeep(type) {
  try {
    ensureAudio();
    const c = _ctx;
    if (type === 'valid') {
      [[880,0],[1320,0.18]].forEach(([freq,delay]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, c.currentTime+delay);
        g.gain.linearRampToValueAtTime(0.4, c.currentTime+delay+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+delay+0.35);
        o.start(c.currentTime+delay); o.stop(c.currentTime+delay+0.35);
      });
    } else if (type === 'used') {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = 'triangle'; o.frequency.value = 440;
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(0.35, c.currentTime+0.03);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.6);
      o.start(c.currentTime); o.stop(c.currentTime+0.6);
    } else {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(300, c.currentTime);
      o.frequency.linearRampToValueAtTime(120, c.currentTime+0.4);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(0.3, c.currentTime+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.4);
      o.start(c.currentTime); o.stop(c.currentTime+0.45);
    }
  } catch {}
}

// ══════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════
function showModal(type, parsed, rec) {
  const sheet   = $('modal-sheet');
  const iconRing = $('modal-icon-ring');
  const icon    = $('modal-icon');
  const heading = $('modal-heading');
  const details = $('modal-details');
  const btn     = $('modal-btn');

  const configs = {
    valid:    { bg:'linear-gradient(160deg,#0D3320,#071A10)', ring:'rgba(34,197,94,0.15)', ringBorder:'rgba(34,197,94,0.3)', icon:'✓', iconColor:'#4ADE80', title:'BILLETE VÁLIDO', titleColor:'#4ADE80', btn:'#15803D', btnText:'#fff' },
    used:     { bg:'linear-gradient(160deg,#3A1000,#1C0800)', ring:'rgba(249,115,22,0.15)', ringBorder:'rgba(249,115,22,0.3)', icon:'⚠', iconColor:'#F97316', title:'YA UTILIZADO', titleColor:'#F97316', btn:'#7C2D12', btnText:'#fff' },
    notfound: { bg:'linear-gradient(160deg,#3A0000,#1C0000)', ring:'rgba(239,68,68,0.15)', ringBorder:'rgba(239,68,68,0.3)', icon:'✗', iconColor:'#EF4444', title:'NO ENCONTRADO', titleColor:'#EF4444', btn:'#7F1D1D', btnText:'#fff' },
  };
  const cfg = configs[type];
  sheet.style.background = cfg.bg;
  iconRing.style.background = cfg.ring;
  iconRing.style.border = `2px solid ${cfg.ringBorder}`;
  icon.textContent = cfg.icon; icon.style.color = cfg.iconColor;
  heading.textContent = cfg.title; heading.style.color = cfg.titleColor;
  btn.style.background = cfg.btn; btn.style.color = cfg.btnText;

  let html = '';
  const addRow = (key, val, color='') =>
    html += `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-val"${color ? ` style="color:${color}"` : ''}>${val}</span></div>`;

  if (parsed?.pasajero && parsed.pasajero !== '—')
    addRow('Pasajero', parsed.pasajero);
  if (rec?.compra_id)
    addRow('Compra', rec.compra_id.substring(0,8)+'…');
  if (rec?.metodo_pago)
    addRow('Método', rec.metodo_pago);
  if (rec?.fecha_pago)
    addRow('Comprado', fmt(rec.fecha_pago));
  if (type === 'used' && rec?.fecha_escaneo)
    addRow('Usado el', fmt(rec.fecha_escaneo), '#F97316');
  if (type === 'valid' && rec?.escaneado_por)
    addRow('Validado por', rec.escaneado_por, '#4ADE80');
  if (!rec && parsed?.compra_id)
    addRow('ID QR', parsed.compra_id.substring(0,8)+'…');

  details.innerHTML = html;
  $('modal').classList.add('show');
}
function closeModal()        { $('modal').classList.remove('show') }
function handleModalBg(e)    { if (e.target === $('modal')) closeModal() }

// ══════════════════════════════════════════════
//  HISTORY & RECENT
// ══════════════════════════════════════════════
let histCount = 0;

function addToHistory(parsed, rec) {
  histCount++;
  $('hist-count').textContent = histCount;

  const nombre = parsed?.pasajero && parsed.pasajero !== '—'
    ? parsed.pasajero
    : `Compra ${String(rec.compra_id).substring(0,8)}…`;
  const compra = String(rec.compra_id || '').substring(0,8);
  const timeStr = new Date().toLocaleTimeString('es-GQ', { hour:'2-digit', minute:'2-digit' });

  // History tab
  const histList = $('history-list');
  if (histList.querySelector('.empty-msg')) histList.innerHTML = '';
  const hi = document.createElement('div');
  hi.className = 'hist-item';
  hi.innerHTML = `
    <div>
      <div class="hist-name">${nombre}</div>
      <div class="hist-meta">${timeStr} · ${compra}…</div>
    </div>
    <span class="hist-badge">✓ OK</span>`;
  histList.prepend(hi);

  // Recent list in Data tab
  const recentList = $('recent-list');
  if (recentList.querySelector('.empty-msg')) recentList.innerHTML = '';
  const ri = document.createElement('div');
  ri.className = 'recent-row';
  ri.innerHTML = `
    <div>
      <div class="rr-name">${nombre}</div>
      <div class="rr-meta">${timeStr} · ${compra}…</div>
    </div>
    <span class="badge-ok">✓ OK</span>`;
  recentList.prepend(ri);
  while (recentList.children.length > 25) recentList.removeChild(recentList.lastChild);
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function fmt(ds) {
  if (!ds) return '—';
  return new Date(ds).toLocaleString('es-GQ', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ══════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = async () => {
    ensureAudio();
    const page = tab.dataset.page;
    if (page !== 'scanner') await stopScanner();
    document.querySelectorAll('.tab,.page').forEach(e => e.classList.remove('active'));
    tab.classList.add('active');
    $('page-'+page).classList.add('active');
    if (page === 'scanner') startScanner();
    if (page === 'data') refreshStats();
  };
});

// ══════════════════════════════════════════════
//  KEYBOARD — login on Enter
// ══════════════════════════════════════════════
['inp-user','inp-pass'].forEach(id => {
  $(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() });
});

document.addEventListener('touchstart', ensureAudio, { once: true });
document.addEventListener('click', ensureAudio, { once: true });

// ══════════════════════════════════════════════
//  RESTORE SESSION (si el token aún es válido)
// ══════════════════════════════════════════════
(async () => {
  const saved = sessionStorage.getItem('fv_token');
  const name  = sessionStorage.getItem('fv_name');
  if (saved && name) {
    S.token    = saved;
    S.userName = name;
    try {
      const r = await apiFetch('/api/me');
      if (r.ok) { enterApp(); return; }
    } catch {}
    logout(); // token expirado
  }
})();
</script>
